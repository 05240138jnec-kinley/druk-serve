<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment - Druk Serve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-base="../">

  <div id="site-navbar"></div>

  <div class="page-header">
    <div class="container">
      <h1>Payment</h1>
      <p class="text-muted mb-0">Choose how you would like to pay for your booking.</p>
    </div>
  </div>

  <main class="container py-4">
    <div id="paymentWrap">
      <div class="row g-4">

        <div class="col-lg-7">
          <!-- Payment choice -->
          <div class="card-ds" id="payForm">
            <h2 class="h5 fw-bold mb-3">Payment Preference</h2>

            <div class="row g-3 mb-4">
              <div class="col-sm-6">
                <input type="radio" class="btn-check" name="payType" id="payOnline" value="online" checked>
                <label class="option-card" for="payOnline"><i class="bi bi-phone"></i><strong>Online Payment</strong><small>mPay or BNB ePay</small></label>
              </div>
              <div class="col-sm-6">
                <input type="radio" class="btn-check" name="payType" id="payCash" value="cash">
                <label class="option-card" for="payCash"><i class="bi bi-cash-coin"></i><strong>Cash</strong><small>Pay the provider after the service</small></label>
              </div>
            </div>

            <!-- Online details -->
            <div id="onlineBox">
              <label class="form-label fw-medium">Select payment method</label>
              <div class="form-check mb-2">
                <input class="form-check-input" type="radio" name="gateway" id="gwMpay" value="mPay" checked>
                <label class="form-check-label" for="gwMpay">BOB mPay</label>
              </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="radio" name="gateway" id="gwBnb" value="BNB ePay">
                <label class="form-check-label" for="gwBnb">BNB ePay</label>
              </div>
              <div class="qr-box mb-3">
                <i class="bi bi-qr-code"></i>
                <div class="small">Demo QR code. A real payment gateway will show the scan-to-pay code here.</div>
              </div>
            </div>

            <!-- Cash details -->
            <div id="cashBox" class="alert alert-info d-none">
              <i class="bi bi-info-circle me-1"></i>You will pay the provider in cash when the job is finished. Your booking will still be sent to the provider.
            </div>

            <button type="button" id="payBtn" class="btn btn-primary w-100 py-2"></button>
          </div>

          <!-- Success message -->
          <div class="card-ds text-center d-none" id="paySuccess">
            <i class="bi bi-check-circle-fill success-icon"></i>
            <h2 class="h4 fw-bold mt-2" id="successTitle"></h2>
            <p class="text-muted" id="successText"></p>
            <div class="d-flex flex-wrap justify-content-center gap-2">
              <a href="my-bookings.html" class="btn btn-primary">View My Bookings</a>
              <a href="home.html" class="btn btn-outline-primary">Back to Home</a>
            </div>
          </div>
        </div>

        <!-- Booking summary -->
        <div class="col-lg-5">
          <div class="card-ds sticky-side" id="paySummary"></div>
        </div>

      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/booking.js"></script>
</body>
</html>
