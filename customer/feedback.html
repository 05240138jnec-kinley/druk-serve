<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rate Your Experience - Druk Serve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-base="../">

  <div id="site-navbar"></div>

  <main class="container py-5">
    <div id="feedbackWrap" class="mx-auto" style="max-width:560px">
      <div class="card-ds text-center">
        <h1 class="h4 fw-bold">Rate Your Experience</h1>
        <p class="text-muted mb-1" id="fbService"></p>
        <p class="fw-medium mb-4">How was the service provided?</p>

        <div id="starRow" class="mb-1" role="radiogroup" aria-label="Star rating"></div>
        <div class="text-muted small mb-1" id="starLabel">Tap a star to rate</div>
        <div class="text-danger small d-none" id="starError">Please select a star rating.</div>

        <div class="text-start mt-4">
          <label for="comment" class="form-label fw-medium">Write your feedback (optional)</label>
          <textarea id="comment" class="form-control" rows="4" maxlength="300" placeholder="Tell others about your experience"></textarea>
          <div class="text-end small text-muted"><span id="charCount">0</span>/300</div>
        </div>

        <div class="d-flex gap-2 mt-3">
          <a href="my-bookings.html" class="btn btn-outline-secondary flex-fill">Skip</a>
          <button type="button" id="submitRating" class="btn btn-primary flex-fill">Submit Rating</button>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/account.js"></script>
</body>
</html>
