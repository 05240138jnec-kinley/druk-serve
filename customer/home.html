<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - Druk Serve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-base="../">

  <div id="site-navbar"></div>

  <div class="page-header">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <h1 id="welcome">Welcome</h1>
        <p class="text-muted mb-0">What do you need help with today?</p>
      </div>
      <a href="my-bookings.html" class="btn btn-outline-primary"><i class="bi bi-calendar-check me-1"></i>My Bookings</a>
    </div>
  </div>

  <main class="container py-4">

    <!-- Search -->
    <form id="searchForm" class="card-ds mb-4">
      <div class="row g-2">
        <div class="col-md-6"><input type="text" id="searchText" class="form-control" placeholder="Find your services... e.g. plumber, cleaning"></div>
        <div class="col-md-4"><select id="searchService" class="form-select"><option value="">All services</option></select></div>
        <div class="col-md-2 d-grid"><button class="btn btn-primary" type="submit"><i class="bi bi-search me-1"></i>Search</button></div>
      </div>
    </form>

    <!-- Services -->
    <h2 class="h4 fw-bold mb-3">Services Available</h2>
    <div class="row g-3 mb-5" id="serviceGrid"></div>

    <!-- Upcoming bookings -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 fw-bold mb-0">Your Upcoming Bookings</h2>
      <a href="my-bookings.html" class="small">View all</a>
    </div>
    <div class="row g-3 mb-5" id="upcoming"></div>

    <!-- Top providers -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 fw-bold mb-0">Top Providers</h2>
      <a href="providers.html" class="small">See all providers</a>
    </div>
    <div class="row g-3" id="topProviders"></div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/customer.js"></script>
</body>
</html>
