<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find Services - Druk Serve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-base="../">

  <div id="site-navbar"></div>

  <div class="page-header">
    <div class="container">
      <h1>Find a Service Provider</h1>
      <p class="text-muted mb-0">Browse by category, location, price or rating.</p>
    </div>
  </div>

  <main class="container py-4">
    <div class="row g-4">

      <!-- Filters -->
      <aside class="col-lg-3">
        <div class="card-ds sticky-side">
          <h2 class="h6 fw-bold mb-3"><i class="bi bi-funnel me-1"></i>Filters</h2>

          <label class="form-label small fw-medium" for="fQ">Search</label>
          <input type="text" id="fQ" class="form-control mb-3" placeholder="Name or problem">

          <label class="form-label small fw-medium" for="fService">Service</label>
          <select id="fService" class="form-select mb-3"><option value="">All services</option></select>

          <label class="form-label small fw-medium" for="fLocation">Location</label>
          <select id="fLocation" class="form-select mb-3"><option value="">All locations</option></select>

          <label class="form-label small fw-medium" for="fPrice">Price per hour</label>
          <select id="fPrice" class="form-select mb-3">
            <option value="0">Any price</option>
            <option value="300">Up to Nu. 300</option>
            <option value="400">Up to Nu. 400</option>
            <option value="500">Up to Nu. 500</option>
          </select>

          <label class="form-label small fw-medium" for="fRating">Minimum rating</label>
          <select id="fRating" class="form-select mb-3">
            <option value="0">Any rating</option>
            <option value="4">4 stars and above</option>
            <option value="4.5">4.5 stars and above</option>
          </select>

          <button type="button" id="resetBtn" class="btn btn-outline-secondary w-100">Reset filters</button>
        </div>
      </aside>

      <!-- Results -->
      <section class="col-lg-9">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <strong id="resultCount">Loading...</strong>
          <div class="d-flex align-items-center gap-2">
            <label for="fSort" class="small text-muted mb-0">Sort by</label>
            <select id="fSort" class="form-select form-select-sm w-auto">
              <option value="rating">Highest rating</option>
              <option value="priceLow">Price: low to high</option>
              <option value="priceHigh">Price: high to low</option>
              <option value="experience">Most experience</option>
            </select>
          </div>
        </div>
        <div class="row g-3" id="providerList"></div>
      </section>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/customer.js"></script>
</body>
</html>
