<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Bookings - Druk Serve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-base="../">

  <div id="site-navbar"></div>

  <div class="page-header">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <h1>My Bookings</h1>
        <p class="text-muted mb-0">Track your current and past bookings.</p>
      </div>
      <a href="providers.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>New Booking</a>
    </div>
  </div>

  <main class="container py-4">
    <div id="pageAlert"></div>

    <ul class="nav nav-pills mb-4" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#paneCurrent" type="button" id="tabCurrent">Current</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#panePast" type="button" id="tabPast">Past</button></li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="paneCurrent"><div id="currentList"></div></div>
      <div class="tab-pane fade" id="panePast"><div id="pastList"></div></div>
    </div>
  </main>

  <!-- Details pop-up -->
  <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Booking Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="detailsBody"></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div>
    </div></div>
  </div>

  <!-- Cancel confirmation pop-up -->
  <div class="modal fade" id="cancelModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Cancel this booking?</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">The provider will be told that you cancelled. This cannot be undone.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Keep booking</button>
        <button type="button" class="btn btn-danger" id="confirmCancel">Yes, cancel it</button>
      </div>
    </div></div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/booking.js"></script>
</body>
</html>
