<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Worker Dashboard - Druk Serve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-base="../">

  <div id="site-navbar"></div>

  <div class="page-header">
    <div class="container">
      <h1>Worker Dashboard</h1>
      <p class="text-muted mb-0" id="dashSub"></p>
    </div>
  </div>

  <main class="container py-4">
    <div id="verifyNotice"></div>
    <div id="pageAlert"></div>

    <div class="row g-3 mb-4" id="dashStats"></div>

    <ul class="nav nav-pills mb-4" role="tablist">
      <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#paneReq" type="button" id="tabReq">Requests</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#paneConf" type="button" id="tabConf">Confirmed</button></li>
      <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#paneHist" type="button" id="tabHist">History</button></li>
    </ul>
    <div class="tab-content">
      <div class="tab-pane fade show active" id="paneReq"><div id="reqList"></div></div>
      <div class="tab-pane fade" id="paneConf"><div id="confList"></div></div>
      <div class="tab-pane fade" id="paneHist"><div id="histList"></div></div>
    </div>
  </main>

  <!-- Job details pop-up -->
  <div class="modal fade" id="detailsModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Job Details</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="detailsBody"></div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button></div>
    </div></div>
  </div>

  <!-- Confirmation pop-up (decline / complete) -->
  <div class="modal fade" id="actionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title" id="actionTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="actionBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Go back</button>
        <button type="button" class="btn btn-primary" id="actionConfirm"></button>
      </div>
    </div></div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/provider.js"></script>
</body>
</html>
