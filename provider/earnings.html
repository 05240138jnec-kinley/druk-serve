<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Earnings - Druk Serve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-base="../">

  <div id="site-navbar"></div>

  <div class="page-header">
    <div class="container">
      <h1>Earnings</h1>
      <p class="text-muted mb-0">Payment records for your completed jobs.</p>
    </div>
  </div>

  <main class="container py-4">
    <div class="row g-3 mb-4" id="eStats"></div>
    <div class="card-ds">
      <h2 class="h5 fw-bold mb-3">Payment Records</h2>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead><tr><th>Date</th><th>Customer</th><th>Service</th><th>Method</th><th class="text-end">Amount</th></tr></thead>
          <tbody id="eBody"></tbody>
        </table>
      </div>
      <div id="eEmpty" class="empty-state d-none"><i class="bi bi-wallet2"></i>No completed jobs yet.</div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/provider.js"></script>
</body>
</html>
