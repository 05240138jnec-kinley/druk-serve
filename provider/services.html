<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Services - Druk Serve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-base="../">

  <div id="site-navbar"></div>

  <div class="page-header">
    <div class="container">
      <h1>My Services &amp; Availability</h1>
      <p class="text-muted mb-0">Set your service, your rate and when customers can book you.</p>
    </div>
  </div>

  <main class="container py-4">
    <div id="verifyNotice"></div>
    <div class="row g-4">
      <div class="col-lg-7">
        <form id="svcForm" class="card-ds" novalidate>
          <div id="svcAlert"></div>
          <h2 class="h5 fw-bold mb-3">Service details</h2>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="sCategory" class="form-label fw-medium">Service category</label>
              <select id="sCategory" class="form-select"></select>
            </div>
            <div class="col-md-6 mb-3">
              <label for="sRate" class="form-label fw-medium">Rate per hour (Nu.)</label>
              <input type="number" id="sRate" class="form-control" min="50" required>
              <div class="invalid-feedback">Enter a rate of at least Nu. 50.</div>
            </div>
          </div>
          <div class="mb-3">
            <label for="sExperience" class="form-label fw-medium">Years of experience</label>
            <input type="number" id="sExperience" class="form-control" min="0" max="50" required>
            <div class="invalid-feedback">Enter a number from 0 to 50.</div>
          </div>
          <div class="mb-4">
            <label for="sBio" class="form-label fw-medium">Short bio about yourself</label>
            <textarea id="sBio" class="form-control" rows="3" maxlength="300"></textarea>
          </div>

          <h2 class="h5 fw-bold mb-3">Availability</h2>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" role="switch" id="sAvailable">
            <label class="form-check-label fw-medium" for="sAvailable">Accepting new bookings</label>
          </div>
          <label class="form-label fw-medium">Working days</label>
          <div id="dayBox" class="mb-1"></div>
          <div class="text-danger small d-none mb-2" id="dayError">Choose at least one working day.</div>
          <div class="row mt-3">
            <div class="col-6 mb-3">
              <label for="sFrom" class="form-label fw-medium">Start time</label>
              <select id="sFrom" class="form-select"></select>
            </div>
            <div class="col-6 mb-3">
              <label for="sTo" class="form-label fw-medium">End time</label>
              <select id="sTo" class="form-select"></select>
              <div class="invalid-feedback">End time must be after start time.</div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary px-4">Save Changes</button>
        </form>
      </div>

      <div class="col-lg-5">
        <div class="sticky-side">
          <h2 class="h6 fw-bold mb-2 text-muted">How customers see you</h2>
          <div class="row" id="preview"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/provider.js"></script>
</body>
</html>
