<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications - Druk Serve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="../css/style.css" rel="stylesheet">
</head>
<body data-base="../">

  <div id="site-navbar"></div>

  <div class="page-header">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
      <div>
        <h1>Notifications <span class="badge rounded-pill bg-danger fs-6 d-none" id="unreadCount"></span></h1>
        <p class="text-muted mb-0">Updates about your bookings and payments.</p>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-primary" id="markAll"><i class="bi bi-check2-all me-1"></i>Mark all as read</button>
        <button class="btn btn-outline-danger" id="clearAll"><i class="bi bi-trash me-1"></i>Clear all</button>
      </div>
    </div>
  </div>

  <main class="container py-4" style="max-width:820px">
    <div id="notifList"></div>
  </main>

  <div class="modal fade" id="clearModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Clear all notifications?</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">All your notifications will be removed.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmClear">Clear all</button>
      </div>
    </div></div>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/account.js"></script>
</body>
</html>
