<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password - Druk Serve</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-base="">

  <div id="site-navbar"></div>

  <div class="row g-0 auth-wrap">
    <div class="col-lg-5 auth-side">
      <h2 class="fw-bold mb-3">Forgot your password?</h2>
      <p class="mb-4">No problem. Enter the email you registered with and we will send you a link to choose a new password.</p>
      <ul>
        <li><i class="bi bi-check-circle-fill"></i> The link works only once</li>
        <li><i class="bi bi-check-circle-fill"></i> It stops working after 30 minutes</li>
      </ul>
    </div>

    <div class="col-lg-7 d-flex align-items-center justify-content-center p-4">
      <div class="auth-card">
        <h1 class="h3 fw-bold">Reset password</h1>
        <p class="text-muted">We will email you a reset link.</p>

        <div id="fpAlert"></div>

        <form id="forgotForm" novalidate>
          <div class="mb-3">
            <label for="fpEmail" class="form-label fw-medium">Email</label>
            <input type="email" class="form-control" id="fpEmail" placeholder="you@example.com" required>
            <div class="invalid-feedback">Please enter a valid email address.</div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2" id="fpBtn">Send reset link</button>
        </form>

        <p class="text-center mt-4 mb-0"><a href="login.html" class="fw-medium"><i class="bi bi-arrow-left me-1"></i>Back to log in</a></p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/recover.js"></script>
</body>
</html>
